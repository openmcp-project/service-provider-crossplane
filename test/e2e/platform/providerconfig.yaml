apiVersion: crossplane.services.open-control-plane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: crossplane
spec:
  crossplaneDiscoveryName: crossplane-discovery
  providerDiscoverySelector:
    matchLabels:
      crossplane.services.open-control-plane.io/discovery: provider
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crossplane-discovery
data:
  components: |
    - name: github.com/openmcp-project/releasechannel/crossplane
      version: "1.20.5"
      resources:
        - name: crossplane
          type: helmChart
          version: "1.20.5"
          access:
            type: ociArtifact
            imageReference: ghcr.io/openmcp-project/service-provider-crossplane/e2e/crossplane:1.20.5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: provider-btp-discovery
  labels:
    crossplane.services.open-control-plane.io/discovery: provider
data:
  components: |
    - name: github.com/openmcp-project/releasechannel/provider-btp
      version: v1.9.0
      resources:
        - name: provider-btp
          type: ociImage
          version: v1.9.0
          access:
            type: ociArtifact
            imageReference: ghcr.io/openmcp-project/service-provider-crossplane/e2e/provider-btp:v1.9.0
